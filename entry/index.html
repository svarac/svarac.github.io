<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出演者さま提出ページ｜SVARAC（スバラシー）</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#141414">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/entry.css?v=4">
</head>
<body>

<!-- top -->
<main class="top" id="v-top">
  <h1 class="top__logo"><img src="../assets/img/logo_full.svg" alt="SVARAC スバラシー！" width="1309" height="507"></h1>
  <div>
    <p class="top__eyebrow">出演者さま 提出ページ</p>
    <p class="top__thanks">ご協力くださり<br>ありがとうございます</p>
  </div>
  <div class="top__btns">
    <a class="big big--red" href="#quiz">
      <span class="big__txt"><span class="big__title">クイズ案提出</span><span class="big__sub">2問・A〜Dの4択</span></span>
      <span class="big__arrow"></span>
    </a>
    <a class="big big--gold" href="#voice">
      <span class="big__txt"><span class="big__title">ボイメ提出</span><span class="big__sub">自己紹介とクイズの音源</span></span>
      <span class="big__arrow"></span>
    </a>
  </div>
  <p class="top__note" id="top-note">ボイメのみのご依頼の方は「ボイメ提出」だけで大丈夫です。</p>
</main>

<!-- forms -->
<div id="v-form" hidden>
  <header class="bar">
    <a class="bar__back" href="#top"><span class="bar__icon"></span>トップ</a>
    <h1 class="bar__title" id="form-title"></h1>
    <img class="bar__logo" src="../assets/img/logo_svarac_mono-white.svg" alt="SVARAC" width="72" height="22">
  </header>
  <div class="wrap page">
    <div id="form-quiz" hidden></div>
    <div id="form-voice" hidden></div>
    <div id="form-state"></div>
  </div>
</div>

<footer class="foot">© SVARAC</footer>

<script src="config.js?v=4"></script>
<script src="assets/common.js?v=4"></script>
<script src="assets/forms.js?v=4"></script>
<script src="assets/public.js?v=4"></script>
</body>
</html>
