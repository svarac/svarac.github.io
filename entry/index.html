<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出演者さま提出ページ｜SVARAC（スバラシー）</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#141414">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/entry.css?v=12">
</head>
<body>

<!-- top: choose your name first -->
<main class="top" id="v-top">
  <h1 class="top__logo"><img src="assets/img/logo_full.svg" alt="SVARAC スバラシー！" width="1309" height="507"></h1>
  <div>
    <p class="top__eyebrow">出演者さま 提出ページ</p>
    <p class="top__thanks">ご協力くださり<br>ありがとうございます</p>
  </div>
  <form class="who" id="who" novalidate>
    <div class="field">
      <label for="who-name">お名前を選んでください</label>
      <div class="combo"><input class="input" id="who-name" placeholder="読みの1文字目を入力（例：や）" aria-describedby="who-hint" disabled><span class="combo__ok">選択済み</span></div>
      <p class="hint" id="who-hint">読みの1文字目を入れると候補が出ます。候補に出てこない場合は、お手数ですが運営までご連絡ください。</p>
      <p class="err" id="who-err"></p>
    </div>
    <button class="btn btn--red btn--lg btn--block who__go" type="submit" disabled>進む<span class="who__arrow"></span></button>
    <div id="who-state"></div>
  </form>
</main>

<!-- after the name: menu (クイズ案＋ボイメ) or a form -->
<div id="v-form" hidden>
  <header class="bar">
    <a class="bar__back" id="bar-back" href="#"><span class="bar__icon"></span><span id="bar-back-label">トップ</span></a>
    <h1 class="bar__title" id="form-title"></h1>
    <img class="bar__logo" src="assets/img/logo_svarac_mono-white.svg" alt="SVARAC" width="72" height="22">
  </header>
  <div class="wrap page">
    <div id="form-state"></div>
    <div id="menu" hidden></div>
    <div id="form-quiz" hidden></div>
    <div id="form-voice" hidden></div>
  </div>
</div>

<!-- shown only if the page's scripts could not start (very old browser, a file failed to load, scripts turned off) -->
<div class="boot-fail" id="boot-fail" hidden>
  <p><b>ページを正しく表示できませんでした。</b></p>
  <p>再読み込みするか、別のブラウザ（Safari・Chrome など）でお試しください。それでも開けない場合は、お手数ですが運営へDMでご連絡ください。</p>
</div>
<noscript><div class="boot-fail"><p>このページを使うには JavaScript を有効にしてください。難しい場合は、お手数ですが運営へDMでご連絡ください。</p></div></noscript>

<footer class="foot">© SVARAC</footer>

<script>
  /* plain old JavaScript on purpose, so it still runs where the main scripts can't */
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!window.SV_OK) { var d = document.getElementById('boot-fail'); if (d) d.hidden = false; var t = document.getElementById('v-top'); if (t) t.style.display = 'none'; }
    }, 300);
  });
</script>
<script src="config.js?v=12"></script>
<script src="assets/common.js?v=12"></script>
<script src="assets/forms.js?v=12"></script>
<script src="assets/public.js?v=12"></script>
</body>
</html>
